{% extends "base.html" %}
{% import "bootstrap/utils.html" as util %}
{% block title %}User Management{% endblock %}
{% block content %}
{{ util.flashed_messages(dismissible=True) }}
<div class="container">
  <h1>{{ self.title() }}</h1>
  <a class="btn btn-secondary" href="{{ url_for('index') }}">Back</a>
  <form id="user-search" class="my-3" action="{{ url_for('manage_users') }}" method="get">
    <label for="user-query" class="form-label">Search by student/staff number, name or email</label>
    <div class="input-group">
      <input id="user-query" class="form-control" type="search" name="q" value="{{ request.args.get('q', '') }}">
      <button class="btn btn-primary" type="submit">Search</button>
    </div>
  </form>
  <noscript><p>Enable JavaScript to load and search users.</p></noscript>
  <p id="users-status" role="status" aria-live="polite">Loading users…</p>
  <button id="users-retry" class="btn btn-secondary" type="button" hidden>Retry</button>
  <div id="users-list" class="mt-3" data-url="{{ url_for('manage_users_data') }}" aria-busy="true"></div>
</div>
{% endblock %}
{% block scripts %}
{{ super() }}
<script src="{{ url_for('static', filename='js/manageusers.js') }}"></script>
{% endblock %}
