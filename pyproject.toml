[project]
name = "lug-vpn-web"
version = "2.0.0"
description = "USTCLUG VPN Web Management System"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.13"

dependencies = [
    "flask>=3.1.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-login>=0.6.3",
    "flask-wtf>=1.2.2",
    "flask-mail>=0.10.0",
    "flask-bootstrap>=3.3.7.1",
    "sqlalchemy>=2.0.35",
    "pymysql>=1.1.0",
    "wtforms>=3.2.1",
    "itsdangerous>=2.2.0",
    "email-validator>=2.2.0",
    "gunicorn>=23.0.0",
    "wireguard-tools>=0.5.1",
    "qrcode[pil]>=7.4",
    "sseclient-py>=1.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-flask>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-flask>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
