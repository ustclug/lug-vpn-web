services:
  # ----------------------------
  # Edge: Caddy reverse proxy
  # ----------------------------
  caddy:
    profiles: [ "core" ]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    depends_on:
      - web

  # ----------------------------
  # Core: web + mysql + freeradius
  # ----------------------------
  web:
    profiles: [ "core", "dev" ]
    build:
      context: .
    image: lugvpn-web:local
    restart: unless-stopped
    environment:
      # Timezone (Alpine uses TZ directly)
      TZ: ${TZ:-Asia/Shanghai}
      # Flask configuration (read by app/config.py)
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      # Optional. If set, MUST match the external Host header (otherwise Flask returns 404).
      SERVER_NAME: ${SERVER_NAME:-}
      SEND_FILE_MAX_AGE_DEFAULT: ${SEND_FILE_MAX_AGE_DEFAULT:-3600}
      # Database connection
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-radius}
      MYSQL_USER: ${MYSQL_USER:-radius}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-radius}
      MYSQL_CHARSET: ${MYSQL_CHARSET:-utf8}
      # Mail
      MAIL_ENABLE: ${MAIL_ENABLE:-False}
      MAIL_SERVER: ${MAIL_SERVER:-mail}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_TLS_ENABLE: ${MAIL_TLS_ENABLE:-False}
      MAIL_SSL_ENABLE: ${MAIL_SSL_ENABLE:-False}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SENDER: ${MAIL_SENDER:-noreply@vpn.example.org}
      ADMIN_MAIL: ${ADMIN_MAIL:-vpn@example.org}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      # WireGuard
      WG_SERVER_ENDPOINT: ${WG_SERVER_ENDPOINT:-vpn.example.org:51820}
      WG_SERVER_PRIVATE_KEY: ${WG_SERVER_PRIVATE_KEY}
      WG_LISTEN_PORT: ${WG_LISTEN_PORT:-51820}
      WG_SERVER_INTERFACE_IP: ${WG_SERVER_INTERFACE_IP:-10.100.0.1/16}
      WG_MTU: ${WG_MTU:-1420}
      WG_ADDRESS_POOL: ${WG_ADDRESS_POOL:-10.100.0.0/16}
      WG_DNS: ${WG_DNS:-1.1.1.1}
      WG_ALLOWED_IPS: ${WG_ALLOWED_IPS:-0.0.0.0/0, ::/0}
      SSE_TOKEN: ${SSE_TOKEN:-change-me-token}
    ports:
      - "${WEB_PORT:-5000}:5000"
    volumes:
      - ./app:/srv/lugvpn-web/app
      - ./scripts:/srv/lugvpn-web/scripts
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mysql:
    profiles: [ "dev" ]
    image: mysql:5.7
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-radius}
      # Create an application user for the `web` container.
      MYSQL_USER: ${MYSQL_USER:-radius}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-radius}
    volumes:
      - "mysql_data:/var/lib/mysql"
      - "./init-db.sql:/docker-entrypoint-initdb.d/02-init-db.sql:ro"
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-me}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  caddy_data: {}
  caddy_config: {}
  mysql_data: {}
